<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech To Text</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

	<link rel="stylesheet" href="style.css">

<body>
	
	<h1 class="text-center">Speech to Text</h1>
    <div class="container" >
		<div class="row justify-content-around">		
			<div class="col-4">
							<div class="card">					  
							  <div class="card-body">
							    <h5 class="card-title">Convert Your Speech to Text</h5>
							    <p class="card-text">Click the microphone and start speaking</p>
							    <button id="recordButton" type="button" class="btn btn-outline-danger btn-circle btn-xl"><i class="bi bi-mic"></i></button>
							  </div>
							</div>
						</div>
		
			<div class="col-6">
							<div class="card">
							  <div class="card-body">
							    <h5 class="card-title">Card title</h5>
							    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
							    <a href="#" class="btn btn-primary">Go somewhere</a>
							  </div>
							</div>
						</div>
		
			
		</div>
	</div>
	<script src="logicRecord.js"></script>
</body>
</html>
