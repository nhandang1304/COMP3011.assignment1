<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech To Text</title>
	<!-- Bootstrap CSS for layout and styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="style.css">
	
</head>

<body>
	<!-- Page heading -->
	<h1 class="text-center"><span><i class="bi bi-soundwave"></i>  Speech</span> to <span>Text  <i class="bi bi-card-text"></i></span></h1>
	<p class="text-center mt-4 description">Record your speech using your microphone, and our system will convert your spoken words into text</p>
    <div class="container" >
		
		<!-- Error message displayed when an error occurs -->
		<p id="errorMessage" class="alert alert-danger" style="display: none;" role="alert"></p>
		<div class="row align-items-center justify-content-around">		
			<div class="col-4">
							<div class="card">					  
							  <div class="card-body text-center">
								
								<!-- Recording status message -->
								  <p class="alert alert-primary" role="alert" id="recordingStatus" style="display: none;"></p>
								  
								  <!-- Instructions shown to the user -->
							    <p id="instruction" class="card-text mb-4">Click the microphone and start speaking</p>
								<div id="recordingIndicator" style="display: none;" class="recording-indicator">
									<img src="images/audio_waveform.svg" alt="Recording...">   
								</div>
								<div class="d-flex justify-content-center gap-5 mt-4 mb-4">
									<!-- Start and stop recording buttons -->
								    <button id="recordButton" data-bs-custom-class="custom-tooltip" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Click to start recording" type="button" class="btn btn-outline-primary btn-circle btn-xl"><i class="bi bi-mic"></i></button>
									<button id="stopRecord" data-bs-custom-class="custom-tooltip" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Click to stop recording"  type="button" class="btn btn-outline-primary btn-circle btn-xl"><i class="bi bi-mic-mute-fill"></i></button>
								</div>
								</div>
							</div>
						</div>
			<div class="col-auto arrow"><i class="bi bi-arrow-right-circle-fill"></i></div>
			<div class="col-6">
				<!-- Transcription result -->
							<div class="card transcription-card" >
							  <div class="card-body text-center">
							    <p class="card-title">Transcription</p>
							    <p id="contentResponse" class="card-text"></p>
							    
							  </div>
							</div>
						</div>
		
			
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Custom JavaScript for recording and transcription -->	
	<script src="logicRecord.js"></script>
	
</body>
</html>
